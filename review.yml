- date: '2026-08-19'
  rating: 3
  summary: 'Re-profiled under the university pipeline, which settles WHO OPERATES each surface before
    saving anything. EPFL comes out of it well: four institution-operated public APIs on its own registrable
    domain — Actu news, Memento events, Infoscience (self-hosted DSpace-CRIS) and GETprime — plus a real,
    machine-readable identity-federation footprint in SWITCHaai. No vendor contract was found attributed
    to EPFL, so nothing had to be removed. Three defects were corrected. (1) Six derived OpenAPIs pointed
    at actu.epfl.ch for resources actu.epfl.ch 404s on; all thirteen collections were probed against both
    hosts and the servers[] corrected. (2) The OAI-PMH pointer carried since 2026-06-03 is a soft-404
    — it returns HTTP 404 with a 486 KB Angular shell; the live base URL is /server/oai/openaire4. (3)
    The profile claimed ''Open Data'' with no open-data portal behind it; data.epfl.ch redirects to a
    laboratory page. Two surfaces were added that the June pass missed: GETprime and the SAML federation
    entities. Two tenant relationships are now recorded rather than silently credited: library discovery
    on Ex Libris Primo/Alma via SLSP, and the SWITCH edu-ID hosted identity provider. All endpoints below
    were probed live on 2026-08-19.'
  endpoints:
  - url: https://actu.epfl.ch/api/v1/
    status: 200
    note: Actu News API root, lists 7 resources. Institution-operated.
  - url: https://memento.epfl.ch/api/v1/
    status: 200
    note: Memento Events API root, lists 8 resources. Institution-operated.
  - url: https://actu.epfl.ch/api-docs/
