- aid: epfl:infoscience
  name: EPFL Infoscience Institutional Repository
  x-operator: institution
  x-operator-basis: >-
    infoscience.epfl.ch is EPFL's own host, not an account on a vendor's platform. The software is DSpace-CRIS
    — the OAI provider identifies itself as "DSpace-CRIS OAI-PMH Data Provider" — so the CONTRACT SHAPE
    is DSpace's, and no DSpace spec is saved under EPFL's slug. The endpoint, the identifiers (oai:infoscience.epfl.ch:20.500.14299/…)
    and the adminEmail (infoscienceAdmin@epfl.ch) are EPFL's.
  description: >-
    Infoscience is EPFL's institutional repository and CRIS, self-hosted on EPFL infrastructure and running
    DSpace-CRIS. It exposes a HAL/HATEOAS REST API rooted at /server/api with 40+ link relations, and
    an OAI-PMH 2.0 provider with a single context, openaire4, declaring compliance with the OpenAIRE Guidelines
    for Literature Repositories v4.0. Records carry DataCite Kernel 4 metadata and ORCID name identifiers.
    Harvesting is supported from earliestDatestamp 2004-08-31 at second granularity. Anonymous reads of
    /server/api/core/items return 401, so OAI-PMH is the usable public harvesting surface.
  humanURL: https://infoscience.epfl.ch/
  baseURL: https://infoscience.epfl.ch/server/api
