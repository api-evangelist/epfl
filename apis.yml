- aid: epfl:identity-federation
  name: EPFL SAML Identity Federation Entities
  x-operator: institution
  x-operator-basis: >-
    The entityIDs, the Shibboleth SP deployments and the attribute-release requests are EPFL's own, published
    under epfl.ch hostnames. The aggregate they are published IN is operated by SWITCH, which is why the
    registry URL below is a property and not this entry's baseURL.
  description: >-
    EPFL is a registered member of SWITCHaai, the Swiss academic identity federation, which is exported
    to eduGAIN. Seventeen entityIDs containing "epfl" appear in the federation aggregate. EPFL's identity
    provider entity, https://idp.epfl.ch/idp/shibboleth, carries the REFEDS Research & Scholarship entity
    category and REFEDS Sirtfi. EPFL-operated Shibboleth service providers are registered at https://companion.epfl.ch/shibboleth
    (9 requested attributes; host resolves and returns 200) and https://tequila.epfl.ch/shibboleth (16
    requested attributes, including swissEduPersonMatriculationNumber and swissEduPersonStudyLevel) —
    but note that tequila.epfl.ch NO LONGER RESOLVES in public DNS as of 2026-08-19, so that registration
    is stale metadata rather than a reachable service. This is machine-readable institutional infrastructure
    that is almost never catalogued, and the entities are genuinely EPFL's.
  humanURL: https://companion.epfl.ch/
  tags:
  - Identity Federation
  - SAML
  - Shibboleth
  - eduGAIN
  properties:
  - type: IdentityFederation
    url: https://metadata.aai.switch.ch/metadata.switchaai.xml
  - type: Scopes
    url: scopes/epfl-scopes.yml
- aid: epfl:eduid-idp
  name: EPFL Identity Provider (SWITCH edu-ID, tenant)
  x-operator: tenant
  x-operator-basis: >-
    The entityID https://idp.epfl.ch/idp/shibboleth is EPFL's namespace, but the SingleSignOnService endpoints
    in the federation metadata point at https://epfl.login.eduid.ch/idp/profile/SAML2/…, an EPFL-specific
    hostname on SWITCH's hosted edu-ID platform. EPFL's users and EPFL's attribute policy; SWITCH's running
    IdP. No SWITCH contract is saved under EPFL's slug.
  description: >-
    EPFL's SAML identity provider is delivered by SWITCH edu-ID as a hosted, EPFL-branded IdP. The relationship
    is a real institutional fact — EPFL authenticates its community through it and its entity is federated
    into eduGAIN — but the engineering belongs to SWITCH, so it is recorded as a tenant relationship rather
    than credited to EPFL.
  humanURL: https://www.switch.ch/edu-id/
  tags:
  - Identity Federation
  - SAML
  - Tenant
  properties:
  - type: IdentityFederation
    url: https://www.switch.ch/edu-id/
- aid: epfl:swisscovery-library
  name: EPFL Library Discovery on swisscovery (Ex Libris, tenant)
  x-operator: tenant
  x-operator-basis: >-
    epfl.swisscovery.ch CNAMEs to slsp-epfl.primo.exlibrisgroup.com and then to eu03.primo.exlibrisgroup.com.
    The federation metadata additionally registers https://slsp-epfl.alma.exlibrisgroup.com/mng/login
    and https://slsp-epfl.primo.exlibrisgroup.com/mng/login as EPFL-scoped entities. EPFL-specific account
    on a shared vendor platform run by the SLSP consortium — tenant, not institution.
  description: >-
    EPFL's library discovery and resolution run on Ex Libris Primo VE with Alma behind it, delivered through
    SLSP (Swiss Library Service Platform). EPFL's holdings, EPFL's patrons, EPFL's branded entry point
    — Ex Libris's contract. No Ex Libris specification is saved under EPFL's slug; the relationship is
    recorded so the catalog knows EPFL operates a library discovery layer without crediting EPFL for someone
    else's API.
  humanURL: https://epfl.swisscovery.ch/
  tags:
  - Library
  - Discovery
  - Ex Libris
  - Tenant
  properties:
