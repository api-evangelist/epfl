aid: epfl
name: EPFL
x-type: university
x-category: Technical University
description: >-
  EPFL (École polytechnique fédérale de Lausanne) is a Swiss federal institute of technology in
  Lausanne and one of the two federal technical universities in the ETH Domain. Measured on what it
  actually operates rather than what runs under its name, EPFL is unusual among research
  universities: it runs FOUR public, unauthenticated APIs on its own registrable domain. The Actu
  news API (actu.epfl.ch) and the Memento events API (memento.epfl.ch) are Django REST Framework
  services with live interactive CoreAPI documentation; Infoscience (infoscience.epfl.ch) is EPFL's
  self-hosted DSpace-CRIS repository serving a HAL/HATEOAS REST API and a working OAI-PMH provider;
  and GETprime (getprime.epfl.ch), from the Gene Expression Core Facility, answers primer-design
  queries over HTTP. EPFL publishes no OpenAPI for any of them and operates no developer portal, no
  API gateway (api.epfl.ch resolves only to RFC 1918 space), no plans, no rate-limit documentation
  and no deprecation policy — every OpenAPI in this repo is derived by API Evangelist and marked as
  such. Its library discovery runs on Ex Libris Primo/Alma through the SLSP consortium and its
  identity provider endpoint is hosted by SWITCH edu-ID; both are recorded here as tenant
  relationships, not as EPFL engineering. There is no public course-catalog or timetable API.
type: Index
x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    Every surface in this profile was probed live on 2026-08-19 and its operator settled before it
    was saved. Four institution-operated APIs answer on epfl.ch hosts; two vendor platforms
    (Ex Libris via SLSP, SWITCH edu-ID) are recorded as tenant relationships rather than credited as
    EPFL contracts. Three surface classes a university might be expected to run were hunted and are
    genuinely absent: there is no public course catalog or timetable API (edu.epfl.ch/api 404,
    isa.epfl.ch does not resolve, sco.epfl.ch does not resolve), no open-data portal (data.epfl.ch
    redirects to a laboratory page on www.epfl.ch), and no public API gateway (api.epfl.ch resolves
    to 10.98.42.206, an internal address). Two negative findings are worth recording as findings
    rather than gaps: search.epfl.ch soft-200s — /api/cse, /api/ldap, /api/unit and
    /api/graphsearch/v2 are documented in the public epfl-si/search-api repository but the live host
    302s every one of them to the human search page, so the API is real code with no public
    endpoint; and graphsearch.epfl.ch sits behind a Cloudflare bot challenge that returns 403 to a
    browser User-Agent while its /api router answers JSON 404s, which grades LIVE, not dead.
