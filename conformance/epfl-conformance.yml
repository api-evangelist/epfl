generated: '2026-08-19'
method: probed
source: >-
  Live probes on 2026-08-19 of actu.epfl.ch, memento.epfl.ch, infoscience.epfl.ch,
  getprime.epfl.ch and www.epfl.ch, plus the SWITCHaai federation metadata aggregate
  at https://metadata.aai.switch.ch/metadata.switchaai.xml (21.3 MB, 1,960 entities).
note: >-
  EPFL is scored under the Kin Score `education` regime. This file records only conformances
  that were observed in a machine-readable artifact or a live response, with the exact location
  of the evidence. Reward-only: a standard EPFL does not implement is recorded as conforms:false
  with the negative probe that established it, and is not held against the institution beyond
  the absence of the reward.
operator_note: >-
  Every conformance below is EPFL-operated. The OAI-PMH provider, the DataCite and ORCID
  metadata, and the SAML entities all sit under epfl.ch or carry an epfl.ch entityID. The
  repository software is DSpace-CRIS and the hosted IdP endpoint is SWITCH edu-ID, so the
  ENGINEERING is not all EPFL's — but the endpoints, the identifiers and the registrations are.
standards:
- id: oai-pmh
  regime: education
  conforms: true
  operator: institution
  evidence: >-
    https://infoscience.epfl.ch/server/oai/openaire4?verb=Identify returns HTTP 200
    text/xml with protocolVersion 2.0, repositoryName "Infoscience", adminEmail
    infoscienceAdmin@epfl.ch, repositoryIdentifier infoscience.epfl.ch, earliestDatestamp
    2004-08-31T00:00:00Z and granularity YYYY-MM-DDThh:mm:ssZ. ListMetadataFormats returns
    marcxml, oai_dc and oai_openaire; ListRecords returns records. The provider advertises
    a single context, openaire4, declaring compliance with the OpenAIRE Guidelines for
    Literature Repositories v4.0.
- id: datacite
  regime: education
  conforms: true
  operator: institution
  evidence: >-
    OAI-PMH ListRecords with metadataPrefix=oai_openaire on
    https://infoscience.epfl.ch/server/oai/openaire4 returns records bound to
    xmlns:datacite="http://datacite.org/schema/kernel-4" and populated with
    datacite:creators, datacite:nameIdentifier, datacite:titles, datacite:identifier,
    datacite:relatedIdentifiers, datacite:rights and datacite:subjects. DOIs resolve, e.g.
    doi.org/10.48550/arXiv.2407.19971.
- id: orcid
  regime: education
  conforms: true
  operator: institution
  evidence: >-
    The same oai_openaire records carry datacite:nameIdentifier
    nameIdentifierScheme="ORCID" with https://orcid.org/ values — 34 occurrences in a single
    ListRecords page fetched 2026-08-19. Scopus Author ID and RID appear alongside it.
- id: saml
  regime: education
  conforms: true
  operator: institution
  evidence: >-
    17 entityIDs containing "epfl" are registered in the SWITCHaai aggregate. EPFL's own
    identity provider is entityID https://idp.epfl.ch/idp/shibboleth, carrying an
    IDPSSODescriptor and an AttributeAuthorityDescriptor with
    protocolSupportEnumeration urn:oasis:names:tc:SAML:2.0:protocol and OrganizationName
    epfl.ch. EPFL-operated service providers include https://tequila.epfl.ch/shibboleth
    (SAML 2.0 + SAML 1.1) and https://companion.epfl.ch/shibboleth.
- id: shibboleth
  regime: education
  conforms: true
  operator: institution
  evidence: >-
    EPFL's service providers run Shibboleth SP: assertion consumer services are published at
    https://companion.epfl.ch/Shibboleth.sso/SAML2/POST, .../Artifact, .../ECP (host resolves,
    HTTP 200) and https://tequila.epfl.ch/Shibboleth.sso/SAML2/POST, .../POST-SimpleSign,
    .../Artifact (registration present, but tequila.epfl.ch does not resolve in public DNS as of
    2026-08-19 — stale federation metadata). The IdP
    entity is additionally tagged with the REFEDS Research & Scholarship entity category
    (http://refeds.org/category/research-and-scholarship) and REFEDS Sirtfi
    (https://refeds.org/sirtfi).
