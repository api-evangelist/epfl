openapi: 3.2.0
info:
  title: Epfl Faculties API
  version: v1
  description: 'Operations tagged Faculties across 2 of this provider''s published API definitions: epfl-actu.yaml, epfl-memento.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://actu.epfl.ch/api/v1
- url: https://memento.epfl.ch/api/v1
security: []
tags:
- name: Faculties
paths:
  /faculties/:
    get:
      operationId: listFaculties
      summary: List all Faculty objects
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: A paginated list of faculties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFacultyList'
      tags:
      - Faculties
    servers:
    - url: https://actu.epfl.ch/api/v1
  /faculties/{id}/:
    get:
      operationId: readFaculty
      summary: Return the details about the given Faculty id
      parameters:
      - $ref: '#/components/parameters/IntId'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: A single faculty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faculty'
      tags:
      - Faculties
    servers:
    - url: https://actu.epfl.ch/api/v1
components:
  parameters:
    Search:
      name: search
      in: query
      description: A search term.
      schema:
        type: string
    Offset:
      name: offset
      in: query
      description: The initial index from which to return the results.
      schema:
        type: integer
    IntId:
      name: id
      in: path
      required: true
      description: A unique integer value identifying this object.
      schema:
        type: integer
    Limit:
      name: limit
      in: query
      description: Number of results to return per page.
      schema:
        type: integer
    Ordering:
      name: ordering
      in: query
      description: Which field to use when ordering the results.
      schema:
        type: string
  schemas:
    PaginatedFacultyList:
      type: object
      properties:
        count:
          type: integer
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Faculty'
    Faculty:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'DRF Token authentication, e.g. "Authorization: Token <key>".'
    basicAuth:
      type: http
      scheme: basic
x-refined-from:
- epfl-actu.yaml
- epfl-memento.yaml
x-operator: institution
